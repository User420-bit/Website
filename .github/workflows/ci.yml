name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (astro check)
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Build prüfen (Routen, H1, Meta-Tags, tote Links, kein externes JS)
        run: npm run test:build

      # Informativ, nicht blockierend: solange Pharrels Anschrift fehlt, wäre
      # CI sonst dauerhaft rot. Blockierend ist dieser Schritt im Deploy.
      - name: Rechtstext-Status
        continue-on-error: true
        run: npm run guard:legal
