name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Blockiert den Deploy, solange das Impressum unvollständig ist.
      # Läuft vor `npm ci`, weil das Skript keine Dependencies braucht.
      - name: Rechtstext prüfen
        run: node scripts/guard-legal.mjs

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Dieselben Prüfungen wie in CI: Ohne Branch-Schutz kann ein roter PR
      # gemergt werden, live gehen soll er trotzdem nicht.
      - name: Typecheck (astro check)
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Architektur-Dokument aktuell
        run: npm run docs:check

      - name: Build
        run: npm run build

      - name: Build prüfen
        run: npm run test:build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
