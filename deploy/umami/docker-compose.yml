# Umami auf dem eigenen Hetzner-Server, mit Postgres und Caddy (HTTPS per Let's Encrypt).
# Einrichtung: README.md in diesem Ordner. Geheimnisse stehen in `.env`, nicht im Repo.
services:
  umami:
    # Vor dem ersten Start auf eine feste Version setzen (Releases:
    # github.com/umami-software/umami/releases), damit ein Neustart nicht unbemerkt aktualisiert.
    image: ghcr.io/umami-software/umami:latest
    environment:
      DATABASE_URL: postgresql://umami:${POSTGRES_PASSWORD}@db:5432/umami
      APP_SECRET: ${APP_SECRET}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'curl -fs http://localhost:3000/api/heartbeat || exit 1']
      interval: 30s
      retries: 5

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - umami-db:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U umami -d umami']
      interval: 5s
      retries: 5

  caddy:
    image: caddy:2-alpine
    ports:
      - '80:80'
      - '443:443'
    environment:
      UMAMI_DOMAIN: ${UMAMI_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - umami
    restart: unless-stopped

volumes:
  umami-db:
  caddy-data:
