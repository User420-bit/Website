<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap"
/>

<style>
  /*
   * The chrome stays deliberately quiet: the previewed site is the subject,
   * and a loud harness makes it harder to judge. Neutrals carry a slight warm
   * bias so the frame reads as chosen rather than as browser default.
   */
  :root {
    --ground: oklch(0.985 0.002 90);
    --raised: oklch(1 0 0);
    --sunk: oklch(0.96 0.003 90);
    --ink: oklch(0.2 0.005 90);
    --ink-muted: oklch(0.47 0.008 90);
    --accent: oklch(0.52 0.13 250);
    --accent-ink: oklch(0.99 0 0);
    --accent-wash: oklch(0.52 0.13 250 / 0.09);
    --line: oklch(0.89 0.004 90);
    --ok: oklch(0.55 0.11 150);
    --warn: oklch(0.65 0.13 75);
    --fail: oklch(0.55 0.19 25);

    --ui:
      ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    --code: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme='light']) {
      --ground: oklch(0.17 0.004 90);
      --raised: oklch(0.22 0.005 90);
      --sunk: oklch(0.14 0.004 90);
      --ink: oklch(0.96 0.003 90);
      --ink-muted: oklch(0.74 0.008 90);
      --accent: oklch(0.76 0.12 250);
      --accent-ink: oklch(0.17 0.02 250);
      --accent-wash: oklch(0.76 0.12 250 / 0.16);
      --line: oklch(0.38 0.006 90);
      --ok: oklch(0.78 0.13 150);
      --warn: oklch(0.8 0.13 80);
      --fail: oklch(0.72 0.16 25);
    }
  }

  :root[data-theme='dark'] {
    --ground: oklch(0.17 0.004 90);
    --raised: oklch(0.22 0.005 90);
    --sunk: oklch(0.14 0.004 90);
    --ink: oklch(0.96 0.003 90);
    --ink-muted: oklch(0.74 0.008 90);
    --accent: oklch(0.76 0.12 250);
    --accent-ink: oklch(0.17 0.02 250);
    --accent-wash: oklch(0.76 0.12 250 / 0.16);
    --line: oklch(0.38 0.006 90);
    --ok: oklch(0.78 0.13 150);
    --warn: oklch(0.8 0.13 80);
    --fail: oklch(0.72 0.16 25);
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--ui);
    font-size: 14px;
    line-height: 1.5;
    -webkit-text-size-adjust: 100%;
  }

  .wrap {
    max-width: 1360px;
    margin: 0 auto;
    padding-inline: 16px;
    padding-block: 20px 28px;
  }

  /* --- Head ------------------------------------------------------------ */

  .head {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 6px 14px;
  }

  h1 {
    margin: 0;
    font-size: 19px;
    font-weight: 650;
    letter-spacing: -0.015em;
    text-wrap: balance;
  }

  .sub {
    margin: 0;
    flex: 1 1 24ch;
    min-width: 0;
    color: var(--ink-muted);
    font-size: 13px;
  }

  .meta {
    font-family: var(--code);
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    color: var(--ink-muted);
    white-space: nowrap;
  }

  /* --- Checks ---------------------------------------------------------- */

  .checks {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin: 14px 0 0;
    padding: 0;
    list-style: none;
  }

  .checks:empty {
    display: none;
  }

  .checks li {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 9px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--raised);
    font-family: var(--code);
    font-size: 11.5px;
    font-variant-numeric: tabular-nums;
    color: var(--ink-muted);
  }

  .checks b {
    color: var(--ink);
    font-weight: 500;
  }

  .checks li[data-state='fail'] {
    border-color: var(--fail);
  }

  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    flex: none;
    background: var(--ok);
  }

  li[data-state='warn'] .dot {
    background: var(--warn);
  }

  li[data-state='fail'] .dot {
    background: var(--fail);
  }

  /* --- Grid ------------------------------------------------------------ */

  .grid {
    display: grid;
    grid-template-columns: 15.5rem minmax(0, 1fr);
    gap: 20px;
    margin-top: 20px;
    align-items: start;
  }

  @media (max-width: 880px) {
    .grid {
      grid-template-columns: minmax(0, 1fr);
    }
  }

  /* --- Route rail ------------------------------------------------------ */

  .rail {
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--raised);
    overflow: hidden;
  }

  .rail-group + .rail-group {
    border-top: 1px solid var(--line);
  }

  .rail-group h2 {
    margin: 0;
    padding: 9px 12px 5px;
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-muted);
  }

  .rail-group ul {
    margin: 0;
    padding: 0 6px 8px;
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 1px;
  }

  .route {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 2px 8px;
    width: 100%;
    padding: 5px 8px;
    border: 0;
    border-radius: 6px;
    background: none;
    color: var(--ink);
    font: inherit;
    font-size: 13px;
    text-align: left;
    cursor: pointer;
  }

  .route:hover {
    background: var(--sunk);
  }

  .route[aria-current='page'] {
    background: var(--accent-wash);
    color: var(--accent);
    font-weight: 550;
  }

  .route .label {
    flex: 1 1 auto;
    min-width: 0;
  }

  .route .path {
    flex: none;
    margin-left: auto;
    font-family: var(--code);
    font-size: 10.5px;
    color: var(--ink-muted);
    white-space: nowrap;
  }

  .route[aria-current='page'] .path {
    color: var(--accent);
  }

  /* A page with no H1 is worth knowing about while reviewing. */
  .route .flag {
    flex: none;
    font-family: var(--code);
    font-size: 10px;
    color: var(--warn);
  }

  .route:focus-visible,
  button:focus-visible,
  a:focus-visible,
  input:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  @media (max-width: 880px) {
    .rail {
      display: flex;
      overflow-x: auto;
    }

    .rail-group {
      flex: none;
      padding-right: 6px;
    }

    .rail-group + .rail-group {
      border-top: 0;
      border-left: 1px solid var(--line);
    }

    .rail-group ul {
      flex-direction: row;
    }

    .route {
      white-space: nowrap;
    }

    .route .path {
      display: none;
    }
  }

  /* --- Stage ----------------------------------------------------------- */

  .stage {
    min-width: 0;
  }

  .bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }

  .seg {
    display: flex;
    gap: 2px;
    padding: 2px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--raised);
  }

  .seg button {
    padding: 4px 10px;
    border: 0;
    border-radius: 6px;
    background: none;
    color: var(--ink-muted);
    font: inherit;
    font-size: 12.5px;
    font-variant-numeric: tabular-nums;
    cursor: pointer;
  }

  .seg button[aria-pressed='true'] {
    background: var(--accent);
    color: var(--accent-ink);
    font-weight: 550;
  }

  .custom {
    width: 5.5rem;
    padding: 4px 8px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--raised);
    color: var(--ink);
    font-family: var(--code);
    font-size: 12px;
    font-variant-numeric: tabular-nums;
  }

  .openlink {
    font-family: var(--code);
    font-size: 11.5px;
    color: var(--accent);
    text-decoration: none;
    border-bottom: 1px solid currentColor;
  }

  .nowat {
    margin-left: auto;
    font-family: var(--code);
    font-size: 11.5px;
    font-variant-numeric: tabular-nums;
    color: var(--ink-muted);
    white-space: nowrap;
  }

  .frame {
    margin: 0 auto;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--raised);
    overflow: hidden;
    transition: max-width 0.18s ease;
  }

  @media (prefers-reduced-motion: reduce) {
    .frame {
      transition: none;
    }
  }

  iframe {
    display: block;
    width: 100%;
    height: clamp(440px, 74vh, 880px);
    border: 0;
    background: var(--raised);
  }

  .foot {
    margin-top: 12px;
    max-width: 72ch;
    color: var(--ink-muted);
    font-size: 12px;
  }

  .foot code {
    font-family: var(--code);
    font-size: 11.5px;
    color: var(--ink);
  }
</style>

<div class="wrap">
  <header class="head">
    <h1>__TITLE__</h1>
    <p class="sub">__SUBTITLE__</p>
    <span class="meta">__META__</span>
  </header>

  <ul class="checks" id="checks"></ul>

  <div class="grid">
    <nav class="rail" id="rail" aria-label="Routes"></nav>

    <div class="stage">
      <div class="bar">
        <div class="seg" id="widths" role="group"></div>
        <input
          class="custom"
          id="custom"
          type="number"
          min="240"
          max="2400"
          step="10"
          placeholder="px"
          aria-label="Custom width in px"
        />
        <div class="seg" id="themes" role="group"></div>
        <a class="openlink" id="open" href="site/index.html" target="_blank" rel="noopener"></a>
        <span class="nowat" id="nowat"></span>
      </div>

      <div class="frame" id="frame">
        <iframe id="view" src="site/index.html" title=""></iframe>
      </div>

      <p class="foot" id="foot"></p>
    </div>
  </div>
</div>

<script>
  const ROUTES = /*__ROUTES__*/ []
  const CHECKS = /*__CHECKS__*/ []
  const WIDTHS = /*__WIDTHS__*/ []
  const S = /*__STRINGS__*/ {}

  const view = document.getElementById('view')
  const frame = document.getElementById('frame')
  const open = document.getElementById('open')
  const nowat = document.getElementById('nowat')
  const custom = document.getElementById('custom')

  view.title = S.frame_title
  open.textContent = S.open
  document.getElementById('foot').textContent = S.foot

  // --- Checks -------------------------------------------------------------

  const checks = document.getElementById('checks')
  for (const c of CHECKS) {
    const li = document.createElement('li')
    li.dataset.state = c.state
    li.innerHTML = `<span class="dot"></span>${c.label} <b></b>`
    li.querySelector('b').textContent = c.value
    checks.append(li)
  }

  // --- Route rail ---------------------------------------------------------

  const rail = document.getElementById('rail')
  const routes = []

  for (const group of ROUTES) {
    const box = document.createElement('div')
    box.className = 'rail-group'
    const h2 = document.createElement('h2')
    h2.textContent = group.items.length > 1
      ? `${group.group} · ${group.items.length}`
      : group.group
    const ul = document.createElement('ul')

    for (const item of group.items) {
      const li = document.createElement('li')
      const btn = document.createElement('button')
      btn.type = 'button'
      btn.className = 'route'
      btn.dataset.src = item.src
      btn.innerHTML =
        '<span class="label"></span>' +
        (item.h1 === false ? '<span class="flag">kein H1</span>' : '') +
        '<span class="path"></span>'
      btn.querySelector('.label').textContent = item.label
      btn.querySelector('.path').textContent = item.path
      btn.addEventListener('click', () => {
        current = item.src
        view.src = current
        // Mark right away: until the load event the frame still shows the old page.
        mark(current)
      })
      routes.push(btn)
      li.append(btn)
      ul.append(li)
    }

    box.append(h2, ul)
    rail.append(box)
  }

  // --- Current page -------------------------------------------------------

  let current = 'site/index.html'

  function mark(here) {
    // Longest matching suffix wins: "/index.html" on its own would otherwise
    // match every section index and always highlight the entry page.
    let hit = null
    for (const b of routes) {
      const tail = b.dataset.src.slice('site'.length)
      if (here.endsWith(tail) && (!hit || tail.length > hit.tail.length)) hit = { b, tail }
    }
    routes.forEach((b) => {
      if (hit && b === hit.b) b.setAttribute('aria-current', 'page')
      else b.removeAttribute('aria-current')
    })
    open.href = hit ? hit.b.dataset.src : current
  }

  function sync() {
    // Only the frame knows about clicks *inside* the page. Same origin, so
    // normally readable — under file:// it throws, and the last src we set
    // stays authoritative.
    try {
      current = view.contentWindow.location.pathname || current
    } catch (e) {
      /* opaque origin */
    }
    mark(current)
    applyTheme()
  }

  view.addEventListener('load', sync)

  // --- Width --------------------------------------------------------------

  const widthBox = document.getElementById('widths')
  const widthBtns = []

  for (const w of [...WIDTHS, 0]) {
    const b = document.createElement('button')
    b.type = 'button'
    b.textContent = w ? `${w}` : S.full
    b.dataset.w = String(w)
    b.addEventListener('click', () => setWidth(w, b))
    widthBox.append(b)
    widthBtns.push(b)
  }

  function setWidth(w, pressed) {
    widthBtns.forEach((b) => b.setAttribute('aria-pressed', String(b === pressed)))
    frame.style.maxWidth = w ? `${w}px` : 'none'
    if (pressed) custom.value = ''
    report(w)
  }

  custom.addEventListener('input', () => {
    const w = Number(custom.value)
    if (!w) return
    widthBtns.forEach((b) => b.setAttribute('aria-pressed', 'false'))
    frame.style.maxWidth = `${w}px`
    report(w)
  })

  function report(w) {
    // The frame's own width is the truth once it is narrower than the stage.
    const px = w || frame.clientWidth
    nowat.textContent = `${S.width} ${px} px`
  }

  // --- Theme --------------------------------------------------------------

  // Many sites key their theme off a data-theme attribute on <html>. Setting
  // it costs nothing on sites that do not, and saves an OS-level switch on
  // sites that do. Re-applied after every navigation, since each page is new.
  const themeBox = document.getElementById('themes')
  let theme = ''

  for (const [value, text] of [
    ['', S.auto],
    ['light', S.light],
    ['dark', S.dark],
  ]) {
    const b = document.createElement('button')
    b.type = 'button'
    b.textContent = text
    b.setAttribute('aria-pressed', String(value === ''))
    b.addEventListener('click', () => {
      theme = value
      ;[...themeBox.children].forEach((c) => c.setAttribute('aria-pressed', String(c === b)))
      applyTheme()
    })
    themeBox.append(b)
  }

  function applyTheme() {
    try {
      const root = view.contentDocument.documentElement
      if (theme) root.setAttribute('data-theme', theme)
      else root.removeAttribute('data-theme')
    } catch (e) {
      /* opaque origin */
    }
  }

  // --- Boot ---------------------------------------------------------------

  setWidth(0, widthBtns[widthBtns.length - 1])
  // The frame can already be loaded before this script runs.
  sync()
</script>
